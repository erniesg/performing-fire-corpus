[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "performing-fire-corpus"
version = "0.1.0"
description = "Privacy-safe, rights-aware performing arts corpus tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.37.32,<2", "jsonschema>=4.10,<5"]

[project.optional-dependencies]
dev = ["setuptools>=68,<76"]

[project.scripts]
performing-fire-corpus = "performing_fire_corpus.cli:main"

[tool.setuptools]
packages = [
  "performing_fire_corpus",
  "performing_fire_corpus.migrations",
  "performing_fire_corpus.schemas.v1",
]
package-dir = {"" = "src", "performing_fire_corpus.schemas.v1" = "schemas/v1"}

[tool.setuptools.package-data]
"performing_fire_corpus.migrations" = ["*.sql"]
"performing_fire_corpus.schemas.v1" = ["*.json"]
